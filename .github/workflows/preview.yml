name: Preview Build

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Keep builds and publication serialized for the rolling preview release.
concurrency:
  group: mpvrx-preview
  cancel-in-progress: false

jobs:
  check:
    name: Resolve preview build decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.activity.outputs.should_build }}
      source_fingerprint: ${{ steps.activity.outputs.source_fingerprint }}
      commit_count: ${{ steps.metadata.outputs.commit_count }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      commit_title: ${{ steps.metadata.outputs.commit_title }}
      published_at: ${{ steps.metadata.outputs.published_at }}

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for unpublished app activity
        id: activity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          preview_manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/preview/latest.json"
          source_fingerprint="$(
            git ls-files -s -- \
              app third_party .gitmodules build.gradle.kts settings.gradle.kts \
              gradle.properties gradle scripts/build_preview_manifest.py \
              .github/workflows/preview.yml \
              | sha256sum | cut -d' ' -f1
          )"
          latest_fingerprint="$(
            curl -fsSL --retry 3 --retry-delay 2 "$preview_manifest_url" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("source_fingerprint", ""))' \
              2>/dev/null || true
          )"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$source_fingerprint" != "$latest_fingerprint" ]]; then
            should_build=true
          else
            should_build=false
          fi
          {
            echo "should_build=$should_build"
            echo "source_fingerprint=$source_fingerprint"
          } >> "$GITHUB_OUTPUT"
          echo "Preview build required: $should_build"

      - name: Set build metadata
        id: metadata
        if: steps.activity.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit_count=$(git rev-list --count HEAD)"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "commit_title=$(git log -1 --format=%s)"
            echo "published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Standard preview APKs
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMMIT_COUNT: ${{ needs.check.outputs.commit_count }}
      APK_DIR: standard
      APK_ABIS: universal arm64-v8a armeabi-v7a x86 x86_64

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleStandardPreview --stacktrace --no-daemon --max-workers=2

      - name: Sign and stage preview APKs
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ -z "$SIGNING_KEYSTORE" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Required signing secrets are missing; refusing to publish unsigned preview APKs."
            exit 1
          fi

          test -x "$apksigner"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          # AGP only appends "-unsigned" when the variant has no signing config, so accept
          # either name and always re-sign with the release key.
          sign_apk() {
            local dir="$1"
            local base="$2"
            local label="$3"
            local signed="$dir/$base.apk"
            local unsigned="$dir/$base-unsigned.apk"
            local source=""

            if [[ -f "$unsigned" ]]; then
              source="$unsigned"
            elif [[ -f "$signed" ]]; then
              source="$signed"
            else
              echo "Missing expected $label APK: $unsigned (or $signed)"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            local staged="$dir/$base-signing.apk"
            rm -f "$staged"
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$staged" \
              "$source"
            "$apksigner" verify --verbose "$staged"
            rm -f "$unsigned"
            mv -f "$staged" "$signed"
          }

          out_dir="app/build/outputs/apk/${APK_DIR}/preview"
          test -d "$out_dir"
          mkdir -p downloads

          for abi in $APK_ABIS; do
            base="app-${APK_DIR}-${abi}-preview"
            sign_apk "$out_dir" "$base" "${APK_DIR} ${abi} preview"
            cp "$out_dir/$base.apk" "downloads/mpvRx-preview-r${COMMIT_COUNT}-${abi}.apk"
          done

      - name: Upload preview APKs
        uses: actions/upload-artifact@v7
        with:
          name: preview-apks-standard
          path: downloads/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub preview release
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_COUNT: ${{ needs.check.outputs.commit_count }}
      SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
      COMMIT_TITLE: ${{ needs.check.outputs.commit_title }}
      PUBLISHED_AT: ${{ needs.check.outputs.published_at }}
      SOURCE_FINGERPRINT: ${{ needs.check.outputs.source_fingerprint }}

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}

      - name: Download signed preview APKs
        uses: actions/download-artifact@v7
        with:
          name: preview-apks-standard
          path: downloads

      - name: Generate preview update manifest
        run: python3 scripts/build_preview_manifest.py --downloads-dir downloads --output latest.json

      - name: Publish rolling preview prerelease
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; print(json.load(open("latest.json"))["body"])' > preview-notes.md
          title="mpvRx Preview r${COMMIT_COUNT}"
          if ! gh release view preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create preview --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "$title" --notes-file preview-notes.md --prerelease --latest=false
          fi
          # Upload versioned APKs first, then replace the manifest as the publication marker.
          gh release upload preview downloads/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload preview latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit preview --repo "$GITHUB_REPOSITORY" --title "$title" \
            --notes-file preview-notes.md --prerelease --latest=false
          # Only this dedicated prerelease tag is rolling; stable tags are never replaced.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/preview" \
            -f sha="$SOURCE_SHA" -F force=true
          # Keep just the current five APKs; prune only after the new manifest is published.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/preview" \
            --jq '.assets[] | select(.name | endswith(".apk")) | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r asset_id asset_name; do
                if [[ ! -f "downloads/$asset_name" ]]; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                fi
              done

      - name: Upload preview manifest as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-preview-r${{ needs.check.outputs.commit_count }}-manifest
          path: latest.json
          if-no-files-found: error
          retention-days: 14
